version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    # The local app and ZeroGPU use different, matched PyTorch environments.
    exclude-paths:
      - "hf-space/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Update the legacy PyTorch pair together after runtime verification.
      - dependency-name: "torch"
        versions: [">=1.14"]
      - dependency-name: "torchvision"
        versions: [">=0.15"]

  - package-ecosystem: pip
    directory: "/hf-space"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      space-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # New PyTorch pairs need an explicit ZeroGPU compatibility check.
      - dependency-name: "torch"
        versions: [">=2.9"]
      - dependency-name: "torchvision"
        versions: [">=0.24"]
