name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Bone-pre.py
            bone_age/bone_age.py
            models
            utils
            export.py
            evaluation
            tests
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test tools
        run: python -m pip install pytest

      - name: Compile sources
        run: python -m compileall -q Bone-pre.py bone_age/bone_age.py models utils export.py evaluation tests

      - name: Regression tests
        run: python -m pytest -q
