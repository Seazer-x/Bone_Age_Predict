name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Bone-pre.py
            bone_age/bone_age.py
            models
            utils
            export.py
            evaluation
            tests
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test tools
        run: python -m pip install pytest

      - name: Compile sources
        run: python -m compileall -q Bone-pre.py bone_age/bone_age.py models utils export.py evaluation tests

      - name: Regression tests
        run: python -m pytest -q

  environments:
    name: Python 3.10 / ${{ matrix.target }} requirements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: local
            requirements: requirements.txt
          - target: space
            requirements: hf-space/requirements.txt
    env:
      YOLOv5_AUTOINSTALL: 'false'
      NO_ALBUMENTATIONS_UPDATE: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Bone-pre.py
            bone_age/bone_age.py
            models
            utils
            export.py
            evaluation
            tests
            requirements.txt
            hf-space/requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install complete application environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements }}" pytest

      - name: Check installed dependencies
        run: python -m pip check

      - name: Import and runtime smoke checks (CPU, no weights)
        env:
          YOLOV5_CONFIG_DIR: ${{ runner.temp }}/yolov5
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python tests/smoke_environment.py --target "${{ matrix.target }}"

      - name: Regression tests
        run: python -m pytest -q

      - name: Record installed versions
        if: always()
        run: python -m pip freeze > installed-${{ matrix.target }}.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-${{ matrix.target }}
          path: installed-${{ matrix.target }}.txt
