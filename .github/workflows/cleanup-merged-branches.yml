name: One-time merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete merged historical branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "chore/oss-readiness"
            "chore/remove-codex-application-notes"
            "ci/hf-deploy-verify"
            "deploy/hf-zerogpu"
            "docs/english-readme-hf-space"
            "feat/examples-evaluation-colab"
            "revert-2-dependabot/pip/pillow-12.2.0"
          )

          for branch in "${branches[@]}"; do
            encoded_branch="${branch//\//%2F}"
            if gh api "repos/$REPO/branches/$encoded_branch" >/dev/null 2>&1; then
              echo "Deleting merged branch: $branch"
              gh api --method DELETE "repos/$REPO/git/refs/heads/$encoded_branch"
            else
              echo "Already absent: $branch"
            fi
          done
