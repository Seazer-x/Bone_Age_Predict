name: Deploy Hugging Face Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Create or update Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          username = api.whoami(token=token)["name"]
          repo_id = f"{username}/Bone_Age_Predict"

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="docker",
              private=False,
              exist_ok=True,
              token=token,
          )

          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="hf-space",
              token=token,
              commit_message="Deploy Bone_Age_Predict from GitHub",
          )

          print(f"Space: https://huggingface.co/spaces/{repo_id}")
          PY
