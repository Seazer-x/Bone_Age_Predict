name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, dependency versions, and hardware.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: I have removed patient-identifiable or sensitive medical information.
          required: true
